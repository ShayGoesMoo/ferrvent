<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Froggly | Settings</title>

        <link rel="stylesheet" href="../css/index.css">
        <link rel="stylesheet" href="../css/navigation-bar.css">
        <link rel="stylesheet" href="../css/settings.css">
        <link rel="stylesheet" href="../css/states.css">
        <link rel="stylesheet" href="../css/notification-toast.css">

        <link rel="icon" type="image/png" href="../assets/logo 1.png">
        <link rel="apple-touch-icon" href="../assets/logo 1.png">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Mukta+Vaani:wght@200;300;400;500;600;700;800&family=Noto+Serif+NP+Hmong:wght@400..700&family=Noto+Serif+Oriya:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">    
    </head>
    <body>
        <header class="navigation-bar">
            <div class="nav-wrapper">
                <div class="left">
                    <div class="logo">
                        <img src="../assets/logo_main.png" alt="Logo">
                    </div>
                </div>
                <div class="middle">
                    <button type="button" id="home-btn" aria-label="Home">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 11l9-8 9 8M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/>
                        </svg>
                        <span class="btn-label">Home</span>
                    </button>

                    <button type="button" id="create-post" aria-label="New Post">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        <span class="btn-label">New Post</span>
                    </button>

                    <span class="divider"></span>

                    <button type="button" id="suggestions-btn" aria-label="Suggestions">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        <span class="btn-label">Suggestions</span>
                    </button>

                    <button type="button" id="changelog-btn" aria-label="Changelog">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 8v4l3 3M12 3a9 9 0 1 0 9 9"/>
                            <path d="M12 3v4h4"/>
                        </svg>
                        <span class="btn-label">Changelog</span>
                    </button>

                    <button type="button" id="settings-btn" aria-label="Settings">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 
                            0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 
                            0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 
                            2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 
                            2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 
                            1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 
                            0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                        <span class="btn-label">Settings</span>
                    </button>

                    <button type="button" id="notifications-btn" aria-label="Notifications">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                            <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
                        </svg>
                        <span class="btn-label">Notifications</span>
                        <span class="notif-badge" id="notif-badge" style="display: none;">0</span>
                    </button>

                    <span class="divider"></span>

                    <button type="button" id="logout-btn" aria-label="Logout">
                        Logout
                    </button>

                    <div class="right">
                        <div class="user">
                            <img src="../assets/placeholder.png" alt="User avatar">
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="settings-view">
            <h2>Settings</h2>

            <!-- Profile picture -->
            <section class="settings-card">
                <h3>Profile Picture</h3>
                <div class="pfp-row">
                    <img src="../assets/placeholder.png" alt="Current avatar" id="current-avatar">
                    <div class="pfp-actions">
                        <input type="file" id="avatar-input" accept="image/*" hidden>
                        <button type="button" id="avatar-btn">Change Picture</button>
                        <span class="settings-hint">JPG or PNG, up to 5MB</span>
                    </div>
                </div>
            </section>

            <!-- Display name -->
            <section class="settings-card">
                <h3>Display Name</h3>
                <form id="display-name-form">
                    <input type="text" id="display-name-input" placeholder="Display name" required>
                    <button type="submit">Save</button>
                </form>
            </section>

            <!-- Username -->
            <section class="settings-card">
                <h3>Username</h3>
                <form id="username-form">
                    <input type="text" id="username-input" placeholder="Username" required>
                    <button type="submit">Save</button>
                </form>
                <span class="settings-hint" id="username-status"></span>
            </section>

            <section class="settings-card">
                <h3>Bio</h3>
                <form id="bio-form">
                    <textarea id="bio-input" rows="3" maxlength="200" placeholder="Tell people about yourself..."></textarea>
                    <button type="submit">Save</button>
                </form>
            </section>

            <!-- Password -->
            <section class="settings-card">
                <h3>Change Password</h3>
                <form id="password-form">
                    <label>New Password</label>
                    <input type="password" id="new-password-input" placeholder="New password" required>

                    <label>Confirm New Password</label>
                    <input type="password" id="confirm-password-input" placeholder="Confirm new password" required>

                    <button type="submit">Update Password</button>
                </form>
            </section>

            <section class="settings-card">
                <h3>Archived Posts</h3>
                <div class="archived-posts-list" id="archived-posts-list">
                    <!-- populated by JS -->
                </div>
            </section>

            <section class="settings-card">
                <h3>Private Posts</h3>
                <div class="private-posts-list" id="private-posts-list">
                    <!-- populated by JS -->
                </div>
            </section>

            <!-- Delete account -->
            <section class="settings-card danger-zone">
                <h3>Delete Account</h3>
                <p class="settings-hint">This permanently deletes your account and all your posts. This cannot be undone.</p>
                <button type="button" id="delete-account-btn">Delete My Account</button>
            </section>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase-config.js"></script>
        <script src="../js/settings.js"></script>
        <script src="../js/logout.js"></script>
        <script src="../js/toast.js"></script>
        <script src="../js/notifications.js"></script>
        <script src="../js/nav-links.js"></script>
    </body>
</html>
