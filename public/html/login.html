<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Froggly | Login</title>

        <link rel="stylesheet" href="../css/index.css">
        <link rel="stylesheet" href="../css/auth.css">
        <link rel="stylesheet" href="../css/states.css">

        <link rel="icon" type="image/png" href="../assets/logo 1.png">
        <link rel="apple-touch-icon" href="../assets/logo 1.png">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Mukta+Vaani:wght@200;300;400;500;600;700;800&family=Noto+Serif+NP+Hmong:wght@400..700&family=Noto+Serif+Oriya:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">    
    </head>
    <body>
        <div id="bg-layer-a" class="bg-layer"></div>
        <div id="bg-layer-b" class="bg-layer"></div>
        <div class="register">
            <div class="container">
                <form>
                    <label>Username or Email</label>
                    <input type="text" id="identifier" name="identifer" placeholder="Username or Email..." required>

                    <label>Password</label>
                    <input type="password" id="password" name="password" placeholder="Password..." required>

                    <p class="disclaimer">By completing registeration or logging in with an existing account, you agree to the <a href="../html/terms.html">user agreement</a> and <a href="../html/privacy.html">privacy policy</a>.</p>
                    <input type="submit" value="Login">

                    <p class="login">Don't have an account? <a href="../html/register.html">Register here</a>.</p>
                </form>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase-config.js"></script>
        <script src="../js/login.js"></script>
        <script src="../js/game-backgrounds.js"></script>
        <script src="../js/toast.js"></script>
    </body>
</html>
