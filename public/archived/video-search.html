<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Froggly | Video Search</title>

        <link rel="stylesheet" href="../css/index.css">
        <link rel="stylesheet" href="../css/navigation-bar.css">
        <link rel="stylesheet" href="../css/video-search.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Mukta+Vaani:wght@200;300;400;500;600;700;800&family=Noto+Serif+NP+Hmong:wght@400..700&family=Noto+Serif+Oriya:wght@400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="navigation-bar">
            <div class="nav-wrapper">
                <div class="left">
                    <div class="logo"></div>
                </div>
                <div class="middle">
                    <button type="button" id="home-btn">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 11l9-8 9 8M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/>
                        </svg>
                        Home
                    </button>

                    <button type="button" id="video-home">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 3l14 9-14 9V3z"/>
                        </svg>
                        Videos
                    </button>

                    <span class="divider"></span>

                    <button type="button" id="suggestions-btn">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        Suggestions
                    </button>

                    <button type="button" id="changelog-btn">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 8v4l3 3M12 3a9 9 0 1 0 9 9"/>
                            <path d="M12 3v4h4"/>
                        </svg>
                        Changelog
                    </button>

                    <button type="button" id="settings-btn">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 
                            0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 
                            0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 
                            2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 
                            2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 
                            1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 
                            0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                        Settings
                    </button>

                    <span class="divider"></span>

                    <div class="video-search-wrapper">
                        <input type="search" id="video-search-input" placeholder="Search videos..." autocomplete="off">
                        <ul id="suggestions-list" class="suggestions-list hidden"></ul>
                    </div>

                    <div class="right">
                        <div class="user">
                            <img src="../assets/default profile picture.png" alt="User avatar">
                        </div>
                    </div>

                    <span class="divider"></span>

                    <button type="button" id="create-post">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        New Post
                    </button>

                    <span class="divider"></span>

                    <button type="button" id="logout-btn">
                        Logout
                    </button>
                </div>
            </div>
        </header>

        <main>
            <div class="video-search-hero">
                <h1>Find a video</h1>
                <p>Search by keyword, topic, or title.</p>

                <form id="main-search-form" class="main-search-form">
                    <input type="search" id="main-search-input" placeholder="Search videos..." autocomplete="off">
                    <button type="submit">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21l-4.35-4.35"/>
                        </svg>
                        Search
                    </button>
                    <ul id="main-suggestions-list" class="suggestions-list hidden"></ul>
                </form>

                <div class="trending">
                    <span class="trending-label">Trending:</span>
                    <div id="trending-chips" class="trending-chips"></div>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase-config.js"></script>
        <script src="../js/video-search-data.js"></script>
        <script src="../js/video-search.js"></script>
        <script src="../js/logout.js"></script>

        <script>
            document.querySelector("#create-post").addEventListener("click", () => {
                window.location.href = "create-post.html";
            });
            document.querySelector("#settings-btn").addEventListener("click", () => {
                window.location.href = "settings.html";
            });
            document.getElementById("suggestions-btn").addEventListener("click", () => {
                window.location.href = "suggestions.html";
            });
            document.getElementById("changelog-btn").addEventListener("click", () => {
                window.location.href = "changelog.html";
            });
            document.getElementById("home-btn").addEventListener("click", () => {
                window.location.href = "index.html";
            });
            document.getElementById("video-home").addEventListener("click", () => {
                window.location.href = "video-search.html";
            });
        </script>
    </body>
</html>
