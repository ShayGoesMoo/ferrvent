<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ferrvent | Create</title>

        <link rel="stylesheet" href="../shared-css/shared.css">
        <link rel="stylesheet" href="../shared-css/load-state.css">
        <link rel="stylesheet" href="../dashboard/dashboard.css">
        <link rel="stylesheet" href="../profile/profile.css">
        <link rel="stylesheet" href="../settings/settings.css">
        <link rel="stylesheet" href="../new/new.css">
        <link rel="stylesheet" href="../shared-css/responsiveness.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="page-wrapper">
            <div class="site-banner banner-loading" id="site-banner-wrapper">
                <img class="site-banner-img" id="site-banner-img" src="" alt="">
                <div class="grain-overlay"></div>
            </div>

            <div class="nav-bar">
                <div class="search-wrapper">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M11.5 11.5L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <input type="text" id="search-input" class="search-input" placeholder="Search users or posts...">
                    <button class="search-clear" id="search-clear" style="display:none;" aria-label="Clear search">
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1 1L11 11M11 1L1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <div class="search-suggestions" id="search-suggestions"></div>
                </div>

                <nav class="nav-links">
                    <a href="../dashboard/">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 11l9-8 9 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Home</span>
                    </a>
                    <p class="nav-divider">|</p>
                    <a href="../new/">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                        </svg>
                        <span>Create</span>
                    </a>
                    <p class="nav-divider">|</p>
                    <a href="../mail/">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="m3 7l9 6l9-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span>Mail</span>
                    </a>
                    <p class="nav-divider">|</p>
                    <div class="profile-dropdown">
                        <button class="profile-trigger">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="2" y="6" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2.5"/>
                                <path d="M8 3l4 3 4-3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <span class="profile-name">···</span>
                            <svg class="dropdown-arrow" width="10" height="6" viewBox="0 0 10 6" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>

                        <div class="dropdown-menu">
                            <a href="../profile/" class="dropdown-item" id="profile-link">
                                <img class="profile-avatar" id="nav-avatar" src="/assets/pfp.png" alt="">
                                <span class="profile-blog">Guest's Blog</span>
                            </a>
                            <a href="../settings/" class="dropdown-item" id="settings-link">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2.5"/>
                                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <span>Settings</span>
                            </a>
                            <a href="../auth/" class="dropdown-item" id="auth-link">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M16 17l5-5-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M21 12H9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                                <span id="auth-link-text">Log out</span>
                            </a>
                        </div>
                    </div>
                </nav>
            </div>

            <div class="main-thing">
                <div class="settings-box">
                    <h1 class="settings-title">Create</h1>

                    <div class="settings-layout">
                        <div class="settings-sidebar">
                            <button class="settings-tab active" data-panel="post">Image/Gif</button>
                            <button class="settings-tab" data-panel="story">Text/Literature</button>
                        </div>

                        <div class="settings-content">
                            <form id="create-new">
                                <!-- IMAGE POST PANEL -->
                                <div class="settings-panel active" id="panel-post">
                                    <div class="settings-section">
                                        <h3 class="settings-section-title">Photo or Gif</h3>
                                        <input type="file" id="file-input" accept="image/*,image/gif" hidden>

                                        <div id="file-panel">
                                            <div class="file-placeholder" id="file-placeholder">
                                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                    <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/>
                                                    <circle cx="8.5" cy="9" r="1.5" stroke="currentColor" stroke-width="1.5"/>
                                                    <path d="M21 15l-5-5-9 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                                </svg>
                                                <p class="settings-section-desc">Click to insert a photo or gif</p>
                                                <span class="settings-section-desc">Max 10MB</span>
                                            </div>

                                            <div class="preview-wrapper" id="preview-wrapper" style="display: none;">
                                                <img id="preview-file" alt="Preview">
                                                <div class="preview-actions">
                                                    <button type="button" class="edit-link" id="change-file-btn">Change</button>
                                                    <button type="button" class="danger-link" id="remove-file-btn">Remove</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="settings-section">
                                        <h3 class="settings-section-title">Caption</h3>
                                        <div class="settings-field">
                                            <textarea id="caption" name="caption" class="settings-input settings-textarea" placeholder="Describe this post..." maxlength="200"></textarea>
                                        </div>
                                    </div>
                                </div>

                                <!-- TEXT PANEL -->
                                <div class="settings-panel" id="panel-story">
                                    <div class="settings-section">
                                        <h3 class="settings-section-title">Title</h3>
                                        <div class="settings-field">
                                            <input type="text" id="story-title" name="title" class="settings-input" placeholder="Give your post a title..." maxlength="120">
                                        </div>
                                    </div>

                                    <div class="settings-section">
                                        <h3 class="settings-section-title">Content</h3>
                                        <div class="settings-field">
                                            <textarea id="story-body" name="story-body" class="settings-input settings-textarea settings-textarea-tall" placeholder="Write your content..."></textarea>
                                        </div>
                                    </div>
                                </div>
                            </form>

                            <!-- SHARED — applies to either post type -->
                            <div class="settings-section">

                                <div class="toggle-row">
                                    <span class="settings-section-title">Audience</span>
                                    <select name="audience" id="audience" class="settings-input settings-select" disabled>
                                        <option value="public">Public</option>
                                        <option value="private">Private</option>
                                    </select>
                                </div>

                                <div class="toggle-row">
                                    <span class="settings-section-title">Allow commenting</span>
                                    <span class="toggle-switch">
                                        <input type="checkbox" disabled>
                                        <span class="slider"></span>
                                    </span>
                                </div>

                                <div class="toggle-row" id="hide-likes">
                                    <span class="settings-section-title">Hide like count</span>
                                    <span class="toggle-switch">
                                        <input type="checkbox" disabled>
                                        <span class="slider"></span>
                                    </span>
                                </div>
                            </div>

                            <div class="settings-section" id="last-section">
                                <div class="settings-field create-actions">
                                    <button type="button" class="edit-link" id="cancel-btn">Cancel</button>
                                    <button type="submit" class="edit-link settings-save-btn" form="create-new" id="post-btn">Post</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <footer class="bottom">
                <div class="footer-bar">
                    <p class="profile-joindate">Creating something new</p>
                    <a href="" class="footer-link"></a>
                </div>
            </footer>
        </div>

        <script>
            document.querySelectorAll('.settings-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelector('.settings-tab.active').classList.remove('active');
                    tab.classList.add('active');

                    document.querySelector('.settings-panel.active').classList.remove('active');
                    document.getElementById(`panel-${tab.dataset.panel}`).classList.add('active');
                });
            });
        </script>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../shared-js/supabase-config.js"></script>
        <script src="../shared-js/nav-bar.js"></script>
        <script src="../shared-js/update-avatar.js"></script>
        <script src="../new/new.js"></script>
        <script src="../shared-js/logout.js"></script>
    </body>
</html>
